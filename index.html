<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Portfolio</title>
    <link rel="stylesheet" href="style.css"/>
  </head>
  <body>
    <section>
      <div class="moon-container" id="moonArea">
        <div class="moon"></div>
        <div class="hi-text">Hi!</div>
      </div>

      <div class="message-text" id="message">welcome to nin's area!</div>

      <div class="menu" id="menu">
        <button class="menu-trigger" id="menuTrigger">?</button>

        <div class="menu-panel" id="menuPanel">
          <button id="playBtn" class="menu-item" title="Play/Pause Music">▶</button>
          <button id="fishBtn" class="menu-item" title="Fishing Game">🐧</button>
          <button id="profileBtn" class="menu-item" title="Profile">👤</button>
          <a href="https://github.com/rewja" target="_blank" class="menu-item" title="GitHub">
            <img src="images/discord.jpg" alt="github"/>
          </a>
        </div>
      </div>

      <div class="popup" id="popup">
        <button class="close-btn" id="closePopup">❌</button>
        <div class="popup-emoji">o(*￣▽￣*)ブ 🐟</div>
        <p class="popup-title">Help me catch the fish!</p>
        <label for="playerName" class="popup-label">What is your name?</label>
        <input type="text" id="playerName" placeholder="Enter your name"/>
        <button id="startFishing" class="big-btn">Start</button>
      </div>

      <div class="counter" id="counter">
        <span id="fishCounter">0</span>
        <button id="stopFishing">⏹</button>
      </div>

      <div class="popup" id="resultPopup">
        <button class="close-btn" id="closeResult">❌</button>
        <div class="popup-emoji">(〃￣︶￣)人(￣︶￣〃)</div>
        <p id="resultText"></p>
      </div>

      <div class="popup glass" id="profilePopup" style="width:500px;height:400px;">
        <button class="close-btn" id="closeProfile">❌</button>
        <div class="profile-wrap">
          <div class="avatar">    <img src="images/profile.jpg" alt="User Avatar">
          </div>
          <h3>Refani Najwa</h3>
          <h6>17 years old</h6>
          <p> web dev • anime enjoyer</p>
          <div class="tags">
            <span>html</span><span>css</span><span>js</span><span>php</span><span>laravel</span><span>react</span>
          </div>
        </div>
      </div>

      <div id="confettiContainer" class="confetti-container"></div>

      <div class="fish-area" id="fishArea"></div>

      <div class="wave wave1"></div>
      <div class="wave wave2"></div>
      <div class="wave wave3"></div>
      <div class="wave wave4"></div>
      <div class="wave wave5"></div>
    </section>

    <script src="script.js"></script>
  </body>
</html>
