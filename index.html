<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section>
      <div class="moon-container" id="moonArea">
        <div class="moon"></div>
        <div class="hi-text">Hi!</div>
      </div>

      <div class="message-text" id="message">welcome to nin's area!</div>

      <div class="menu" id="menu">
        <button id="playBtn">▶</button> <button id="fishBtn">🐧</button>
        <a href="https://github.com/rewja" target="_blank" id="discordBtn">
          <img src="images/discord.jpg" alt="discord" />
        </a>
      </div>

      <div class="popup" id="popup">
        <button class="close-btn" id="closePopup">❌</button>
        <div class="popup-emoji">o(*￣▽￣*)ブ 🐟</div>
        <p class="popup-title">Help me catch the fish!</p>
        <label for="playerName" class="popup-label">What is your name?</label>
        <input type="text" id="playerName" placeholder="Enter your name" />
        <button id="startFishing" class="big-btn">Start</button>
      </div>

      <div class="counter" id="counter">
        <span id="fishCounter">0</span> <button id="stopFishing">⏹</button>
      </div>

      <div class="popup" id="resultPopup">
        <button class="close-btn" id="closeResult">❌</button>
        <div class="popup-emoji">(〃￣︶￣)人(￣︶￣〃)</div>
        <p id="resultText"></p>
      </div>

      <div class="fish-area" id="fishArea"></div>

      <div class="wave wave1"></div>
      <div class="wave wave2"></div>
      <div class="wave wave3"></div>
      <div class="wave wave4"></div>
      <div class="wave wave5"></div>
    </section>

    <script src="script.js"></script>
  </body>
</html>
